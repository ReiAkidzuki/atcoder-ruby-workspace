name: Self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked --python 3.10
      - run: .venv/bin/python -B test/onlinejudge_compat_test.py
      - run: make self-test RUBY=ruby
