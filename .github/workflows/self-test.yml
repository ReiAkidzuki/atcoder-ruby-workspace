name: Self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
      - run: make self-test RUBY=ruby
