[project]
name = "atcoder-ruby-tools"
version = "0.1.0"
description = "Local command-line tools for the AtCoder Ruby workspace"
requires-python = ">=3.10,<4"
dependencies = [
  "aclogin",
  # v10.10.1 cannot parse AtCoder's MiB/KiB memory limits.
  # Remove this pin after https://github.com/online-judge-tools/api-client/pull/175 is released.
  "online-judge-api-client @ git+https://github.com/online-judge-tools/api-client.git@61ae95b945f00792bea96d80ff0659bf0a32cace",
  "online-judge-tools @ git+https://github.com/online-judge-tools/oj.git@v12.0.0",
]

[tool.uv]
package = false
